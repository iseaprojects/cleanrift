version: 2

updates:
  # Application dependencies.
  - package-ecosystem: "nuget"
    directory: "/src/CleanRift"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      application-dependencies:
        patterns:
          - "*"

  # Test dependencies.
  - package-ecosystem: "nuget"
    directory: "/tests/CleanRift.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:05"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      test-dependencies:
        patterns:
          - "*"

  # GitHub Actions used by the build workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:10"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
