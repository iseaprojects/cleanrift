version: 2

updates:
  # Application dependencies.
  - package-ecosystem: "nuget"
    directory: "/src/CleanRift"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    allow:
      - dependency-name: "Microsoft.Diagnostics.Tracing.TraceEvent"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      application-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Test dependencies.
  - package-ecosystem: "nuget"
    directory: "/tests/CleanRift.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:05"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    allow:
      - dependency-name: "Microsoft.NET.Test.Sdk"
      - dependency-name: "xunit"
      - dependency-name: "xunit.runner.visualstudio"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      test-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the build workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:10"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
